<title>Plant Atlas Demo</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #f2f4f7; --surface: #ffffff; --surface-2: #e8ecf1; --ink: #111a2a; --muted: #56627a; --line: #d2d9e3;

  --right: #1f7a3a; --right-bg: #dff1e4; --unknown: #8a6100; --unknown-bg: #f6ecc9; --wrong: #b3261e; --wrong-bg: #f9dedb;
  --inforce: #1f7a3a; --notinforce: #6b7385; --notinforce-bg: #e4e7ec; --flag: #a04a00; --flag-bg: #fbe8d2;
  --shadow: 0 1px 2px rgba(16, 26, 43, .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f141c; --surface: #18202c; --surface-2: #222c3a; --ink: #e8edf5; --muted: #9daabd; --line: #303c4e;
    --accent: #dfe7f5; --accent-ink: #101826; --focus: #ffa94d; --link: #93a1b8;
    --law: #8fa6ff; --guidance: #4fd1b8; --manufacturer: #f0a45c; --company: #c79bf2; --plant: #f58aa5;
    --law-bg: #1b2440; --guidance-bg: #12302b; --manufacturer-bg: #33261a; --company-bg: #2a2038; --plant-bg: #361c25;
    --right: #5fd083; --right-bg: #173a24; --unknown: #e6c05a; --unknown-bg: #3a3013; --wrong: #ff8a80; --wrong-bg: #45201d;
    --inforce: #5fd083; --notinforce: #9aa5b8; --notinforce-bg: #2a3342; --flag: #f5b06a; --flag-bg: #3d2a14;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f141c; --surface: #18202c; --surface-2: #222c3a; --ink: #e8edf5; --muted: #9daabd; --line: #303c4e;
  --accent: #dfe7f5; --accent-ink: #101826; --focus: #ffa94d; --link: #93a1b8;
  --law: #8fa6ff; --guidance: #4fd1b8; --manufacturer: #f0a45c; --company: #c79bf2; --plant: #f58aa5;
  --law-bg: #1b2440; --guidance-bg: #12302b; --manufacturer-bg: #33261a; --company-bg: #2a2038; --plant-bg: #361c25;
  --right: #5fd083; --right-bg: #173a24; --unknown: #e6c05a; --unknown-bg: #3a3013; --wrong: #ff8a80; --wrong-bg: #45201d;
  --inforce: #5fd083; --notinforce: #9aa5b8; --notinforce-bg: #2a3342; --flag: #f5b06a; --flag-bg: #3d2a14;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
h1, h2, h3, .disp { font-family: "Space Grotesk", Inter, system-ui, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.top { display: flex; align-items: baseline; gap: 14px; padding: 9px 0 8px; flex: none; }
.top h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.top p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.badge.live { background: var(--right-bg); color: var(--right); border-color: transparent; }
.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 58fr 42fr; gap: 14px; }
.left, .right { min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.left { padding: 10px 12px 8px; }
.lhead { display: flex; align-items: baseline; gap: 12px; flex: none; margin-bottom: 6px; }
.lhead h2 { font-size: 16px; margin: 0; white-space: nowrap; }
.showing { font-size: 13px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.showing b { color: var(--ink); font-weight: 600; }
.bands { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.band { flex: 1 1 0; min-height: 0; display: flex; gap: 10px; border-radius: 9px; padding: 7px 8px 7px 0; background: var(--lbg); overflow: hidden; }
.band[data-l="law"] { --lc: var(--law); --lbg: var(--law-bg); }
.band[data-l="guidance"] { --lc: var(--guidance); --lbg: var(--guidance-bg); }
.band[data-l="manufacturer"] { --lc: var(--manufacturer); --lbg: var(--manufacturer-bg); }
.band[data-l="company"] { --lc: var(--company); --lbg: var(--company-bg); }
.band[data-l="plant"] { --lc: var(--plant); --lbg: var(--plant-bg); }
.bname { flex: none; width: 158px; border-left: 5px solid var(--lc); padding-left: 9px; display: flex; flex-direction: column; justify-content: center; }
.bname strong { font-family: "Space Grotesk", Inter, sans-serif; font-size: 16px; color: var(--lc); }
.bname span { font-size: 12px; color: var(--muted); line-height: 1.3; }
.bname em { font-style: normal; font-size: 12px; font-weight: 600; margin-top: 3px; }
.cards { flex: 1; min-width: 0; display: flex; gap: 14px; align-items: center; }
.empty { font-size: 12.5px; color: var(--muted); opacity: .8; }
.card { position: relative; z-index: 2; flex: 1 1 0; min-width: 0; max-width: 250px; max-height: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--lc); border-radius: 8px; padding: 6px 9px; display: flex; flex-direction: column; gap: 1px; box-shadow: var(--shadow); overflow: hidden; }
.card:hover { border-color: var(--lc); }
.card { transition: opacity .35s ease-out, transform .35s ease-out; }
.card.pend { opacity: 0; transform: translateY(10px); }
svg.links .pend { opacity: 0; }
svg.links.fadein path, svg.links.fadein text { animation: fade .3s ease-out; }
.bands.fadein .card, .bands.fadein .whole { animation: rise .28s ease-out; }
.panel.fadein { animation: fade .2s ease-out; }
.val.pulse { animation: pulse .7s ease-out; transform-origin: left center; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes pulse { 40% { transform: scale(1.14); color: var(--right); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.nodes { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 14px 26px; align-items: center; align-content: center; padding-left: 6px; }
.node { position: relative; z-index: 2; background: var(--surface); border: 1.5px solid var(--lc); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); transition: opacity .35s ease-out, transform .35s ease-out, background-color .35s ease-out; }
.node b { margin-left: 6px; color: var(--lc); }
.node.sel { background: var(--lc); color: var(--surface); } .node.sel b { color: var(--surface); }
.node.gone { opacity: .5; border-style: dashed; background: transparent; color: var(--muted); box-shadow: none; transform: scale(.94); }
.node.gone b { color: var(--muted); }
svg.links path, svg.links text { transition: opacity .35s ease-out; }
svg.links .dim { opacity: .22; }
svg.links text.dim { opacity: 0; }
svg.links .pend { opacity: 0; }
.cnt { display: grid; gap: 3px; margin: 4px 0 0; padding: 0; list-style: none; font-size: 13px; }
.cnt b { font-family: "Space Grotesk", Inter, sans-serif; font-size: 16px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; }
.demo { font-size: 13px; margin: 0 0 6px !important; font-weight: 400 !important; }
.demo b { font-weight: 700; }
.card .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .r { font-size: 13px; font-weight: 400; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .src { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .r b { font-weight: 600; } .card .rel { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; min-width: 0; }
.chips .chip { margin-top: 0; }
.chip.srcc { background: var(--surface-2); color: var(--muted); font-weight: 500; }
.chip.ok { background: var(--right-bg); color: var(--inforce); }
.whole { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; overflow: hidden; }
.docs { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.doc { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--lc); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; }
.doc:hover, .doc[aria-pressed="true"] { border-color: var(--lc); }
.doc b { font-weight: 700; margin-left: 3px; }
.rels { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13px; }
.rels b { font-weight: 700; }
.cnts { font-size: 12px; color: var(--muted); line-height: 1.35; }
.cnts b { color: var(--ink); }
.tl { list-style: none; margin: 4px 0 10px; padding: 0; display: grid; gap: 5px; font-size: 12.5px; color: var(--muted); }
.tl b { color: var(--ink); }
.card.off { border-left-color: var(--notinforce); background: var(--notinforce-bg); }
.card.off .r { text-decoration: line-through; text-decoration-color: var(--notinforce); color: var(--muted); }
.card.flagged { border-left-color: var(--flag); }
.chip { align-self: flex-start; max-width: 100%; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--notinforce-bg); color: var(--notinforce); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.card.off .chip { background: var(--surface); }
.chip.flag { background: var(--flag-bg); color: var(--flag); }
.num { position: absolute; top: 4px; right: 5px; width: 19px; height: 19px; border-radius: 50%; background: var(--lc); color: var(--surface); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.card.numbered .s { padding-right: 22px; }
.more { position: relative; z-index: 2; flex: none; border: 1px dashed var(--lc); background: var(--surface); color: var(--lc); font-weight: 600; font-size: 12px; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
svg.links path { fill: none; stroke: var(--link); stroke-width: 1.6; }
svg.links path.derived { stroke-dasharray: 5 4; }
svg.links text { font-size: 10.5px; fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; font-family: Inter, sans-serif; }
.legend { flex: none; display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--muted); padding-top: 6px; white-space: nowrap; overflow: hidden; }
.legend i { display: inline-block; width: 26px; border-top: 2px solid var(--link); vertical-align: middle; margin-right: 6px; }
.legend i.d { border-top-style: dashed; }
.legend .k { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--notinforce-bg); border: 1px solid var(--notinforce); margin-right: 5px; vertical-align: -1px; }

.tabs { flex: none; display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 6px 14px 7px; font-family: "Space Grotesk", Inter, sans-serif; font-size: 15px; font-weight: 600; color: var(--muted); border-radius: 6px 6px 0 0; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; }
.panel h3 { font-size: 14px; margin: 0 0 6px; }
.lead { font-size: 13.5px; color: var(--muted); margin: 0 0 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.askbox { display: flex; gap: 8px; }
.askbox input[type=text] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 14px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 600; }
.btn.ghost { background: var(--surface-2); color: var(--ink); padding: 5px 11px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 5px 11px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.opts { margin: 8px 0 6px; font-size: 12.5px; color: var(--muted); }
.opts input[type=date] { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 12.5px; }
.qs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; max-height: 106px; overflow: auto; }
.qs small { font-weight: 500; opacity: .65; font-size: 10.5px; }
.qs button { background: var(--surface-2); border: 1px solid transparent; border-radius: 6px; padding: 2px 7px; font-size: 11.5px; font-weight: 600; }
.qs button.has { border-color: var(--accent); }
.qs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.ans { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--bg); }
.ans.atlas { border-left: 4px solid var(--accent); }
.ans header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ans header { flex-wrap: wrap; }
.ans header h3 { margin: 0; flex: 1; font-size: 13px; color: var(--muted); font-family: Inter, sans-serif; font-weight: 600; text-transform: none; }
.val { font-family: "Space Grotesk", Inter, sans-serif; font-weight: 700; font-size: 24px; line-height: 1.2; margin: 2px 0 4px; overflow-wrap: anywhere; }
.val.long { font-size: 14px; font-weight: 600; }
.val small { font-size: 13px; font-weight: 500; color: var(--muted); font-family: Inter, sans-serif; }
.txt { font-size: 13px; margin: 0; }
.mark { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.mark.right { background: var(--right-bg); color: var(--right); }
.mark.unknown { background: var(--unknown-bg); color: var(--unknown); }
.mark.wrong, .mark.partly { background: var(--wrong-bg); color: var(--wrong); }
.steps { margin: 8px 0 0; padding: 0 4px 0 0; list-style: none; display: grid; gap: 5px; max-height: 300px; overflow: auto; }
.txt.clip { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.steps button { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px 5px 32px; position: relative; font-size: 12.5px; }
.steps .n { position: absolute; left: 7px; top: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.steps q { display: block; color: var(--muted); font-style: italic; quotes: "\201C" "\201D"; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.steps .loc { font-size: 11px; color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.err { color: var(--wrong); font-weight: 600; font-size: 13px; }

.group { margin-bottom: 14px; }
.group h3 { display: flex; gap: 8px; align-items: baseline; }
.group h3 small { font-family: Inter, sans-serif; font-weight: 500; color: var(--muted); font-size: 12.5px; }
.bar { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
.stack { display: flex; gap: 2px; height: 26px; }
.stack div { display: grid; place-items: center; font-size: 12.5px; font-weight: 700; border-radius: 4px; min-width: 22px; }
.stack .right { background: var(--right); color: var(--surface); }
.stack .unknown { background: var(--unknown-bg); color: var(--unknown); border: 1px solid var(--unknown); }
.stack .wrong { background: var(--wrong); color: var(--surface); }
.keys { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.keys i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.say { font-size: 13.5px; margin: 6px 0 0; font-weight: 500; }
.strip { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; margin-top: 8px; }
.strip div { font-size: 10.5px; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 2px 0 3px; color: var(--muted); }
.strip span { display: flex; justify-content: center; gap: 2px; margin-top: 1px; }
.strip b { width: 15px; height: 15px; border-radius: 3px; font-size: 10px; display: grid; place-items: center; }
.strip b.right { background: var(--right); color: var(--surface); }
.strip b.unknown { background: var(--unknown-bg); color: var(--unknown); }
.strip b.wrong, .strip b.partly { background: var(--wrong); color: var(--surface); }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0; }
.facts div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; color: var(--muted); }
.facts b { display: block; font-family: "Space Grotesk", Inter, sans-serif; font-size: 19px; color: var(--ink); }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); margin: 8px 0; }
.box.ok { border-left: 4px solid var(--right); } .box.warn { border-left: 4px solid var(--flag); } .box.unknown { border-left: 4px solid var(--unknown); }
.box .lab { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.box p { margin: 2px 0 0; font-size: 14px; font-weight: 500; }
.box p.sub { font-size: 12.5px; font-weight: 400; color: var(--muted); margin-top: 4px; }
select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-width: 100%; }
.scenes { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 5px; }
.scenes button { width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: grid; grid-template-columns: 22px 1fr; column-gap: 6px; }
.scenes button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); background: var(--surface-2); }
.scenes .i { font-family: "Space Grotesk", sans-serif; font-weight: 700; color: var(--muted); grid-row: span 2; }
.scenes strong { font-size: 13.5px; }
.scenes span.c { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scenes button { min-width: 0; } .scenes button[aria-pressed="true"] span.c { white-space: normal; }
.whatif { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
.whatif b { color: var(--ink); font-weight: 600; }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 92vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0, 0, 0, .18); z-index: 20; padding: 14px 16px; overflow: auto; }
.drawer h3 { margin: 0 34px 2px 0; font-size: 17px; }
.drawer .x { position: absolute; top: 10px; right: 12px; background: var(--surface-2); border: 0; border-radius: 6px; padding: 4px 10px; font-weight: 700; }
.drawer blockquote { margin: 10px 0; padding: 9px 12px; background: var(--bg); border-left: 3px solid var(--lc, var(--accent)); border-radius: 0 8px 8px 0; font-size: 13.5px; overflow-wrap: anywhere; }
.drawer dl { display: grid; grid-template-columns: 92px 1fr; gap: 5px 10px; font-size: 13px; margin: 8px 0; }
.drawer dt { color: var(--muted); } .drawer dd { margin: 0; overflow-wrap: anywhere; }
.drawer .list { display: grid; gap: 6px; margin-top: 10px; }
.drawer .list .card { max-width: none; flex: none; }
[hidden] { display: none !important; }
body { font-variant-numeric: tabular-nums; }
button, a, input, select { transition: background-color .2s, border-color .2s, color .2s, box-shadow .2s, opacity .2s; }
.band { background: color-mix(in srgb, var(--lc) 7%, var(--surface)); border-left: 3px solid var(--lc); border-radius: 10px; }
.bname { border-left: 0; padding-left: 12px; }
.card, .node, .more, .doc { box-shadow: none; }
.btn { border-radius: 10px; border: 1px solid var(--accent); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.left { position: relative; padding: 12px 14px 10px; }
.lhead { align-items: center; }
.lhead .seg { margin-left: auto; flex: none; border-radius: 999px; }

ove, any natural or legal person who places on the market or puts into service machinery or partly completed machinery covered by this Directive shall be considered a manufacturer;","d":"DIR","a":"Art. 2","l":"law","st":"current","n":"an EU directive"},"st-1528":{"id":"st-1528","s":"attrezzatura di lavoro","p":"definedAs","o":"qualsiasi macchina, apparecchio, utensile o impianto","w":"qualsiasi macchina, apparecchio, utensile o impianto","c":"Agli effetti delle disposizioni di cui al presente titolo","q":"a) attrezzatura di lavoro: qualsiasi macchina, apparecchio, utensile o impianto, inteso come il complesso di macchine, attrezzature e componenti necessari all'attuazione di un processo produttivo, destinato ad essere usato durante il lavoro;","d":"DLGS69","a":"art. 69, c. 1","l":"law","st":"current","n":"a legislative decree"},"st-1529":{"id":"st-1529","s":"uso di una attrezzatura di lavoro","p":"definedAs","o":"qualsiasi operazione lavorativa connessa ad una attrezzatura di lavoro","w":"qualsiasi operazione lavorativa connessa ad una attrezzatura di lavoro","c":"Agli effetti delle disposizioni di cui al presente titolo","q":"b) uso di una attrezzatura di lavoro: qualsiasi operazione lavorativa connessa ad una attrezzatura di lavoro, quale la messa in servizio o fuori servizio, l'impiego, il trasporto, la riparazione, la trasformazione, la manutenzione, la pulizia, il montaggio, lo smontaggio;","d":"DLGS69","a":"art. 69, c. 1","l":"law","st":"current","n":"a legislative decree"},"st-1530":{"id":"st-1530","s":"zona pericolosa","p":"definedAs","o":"qualsiasi zona all'interno ovvero in prossimità di una attrezzatura di lavoro","w":"qualsiasi zona all'interno ovvero in prossimità di una attrezzatura di lavoro","c":"Agli effetti delle disposizioni di cui al presente titolo","q":"c) zona pericolosa: qualsiasi zona all'interno ovvero in prossimità di una attrezzatura di lavoro nella quale la presenza di un lavoratore costituisce un rischio per la salute o la sicurezza del ale situazione nel caso in cui sia stata accertata una contravvenzione, oppure mediante idonea disposizione in ordine alle modalità di uso in sicurezza dell'attrezzatura di lavoro ove non sia stata accertata una contravvenzione;","d":"DLGS70","a":"art. 70, c. 4","l":"law","st":"current","n":"a legislative decree"},"st-1542":{"id":"st-1542","s":"datore di lavoro","p":"hasObligation","o":"mette a disposizione dei lavoratori attrezzature conformi ai requisiti","w":"mette a disposizione dei lavoratori attrezzature conformi ai requisiti","c":"idonee ai fini della salute e sicurezza e adeguate al lavoro da svolgere o adattate a tali scopi","q":"Il datore di lavoro mette a disposizione dei lavoratori attrezzature conformi ai requisiti di cui all'articolo precedente, idonee ai fini della salute e sicurezza e adeguate al lavoro da svolgere o adattate a tali scopi che devono essere utilizzate conformemente alle disposizioni legislative di recepimento delle direttive comunitarie.","d":"DLGS71","a":"art. 71, c. 1","l":"law","st":"current","n":"a legislative decree"},"st-1544":{"id":"st-1544","s":"datore di lavoro","p":"hasObligation","o":"prende in considerazione","w":"prende in considerazione","c":"All'atto della scelta delle attrezzature di lavoro","q":"All'atto della scelta delle attrezzature di lavoro, il datore di lavoro prende in considerazione:","d":"DLGS71","a":"art. 71, c. 2","l":"law","st":"current","n":"a legislative decree"},"st-1545":{"id":"st-1545","s":"datore di lavoro","p":"hasObligation","o":"adotta adeguate misure tecniche ed organizzative","w":"adotta adeguate misure tecniche ed organizzative","c":"\"\"","q":"Il datore di lavoro, al fine di ridurre al minimo i rischi connessi all'uso delle attrezzature di lavoro e per impedire che dette attrezzature possano essere utilizzate per operazioni e secondo condizioni per le quali non sono adatte, adotta adeguate misure tecniche ed organizzative, tra le quali quelle dell'allegato VI.","d":"DLGS71","a":"art. 71, c. 3" of 24 lifting devices","count":85,"words":"The plant's own equipment list"}],"scenario_label":"scenario input, not from a document","today":"2026-11-14","today_plain":"14 November 2026","questions":[{"id":"CQ01","en":"Which categories of machinery always require a conformity assessment procedure involving a notified body?","it":"Quali categorie di macchine richiedono sempre una procedura di valutazione della conformità con un organismo notificato?","short":"Categories Machinery Require Conformity","B":{"value":["removable mechanical transmission devices including their guards","vehicle servicing lifts","Portable cartridge-operated fixing and other impact machinery","safety components with fully or partially self-evolving behaviour","machinery with embedded self-evolving ML systems ensuring safety functions"],"text":"Under the Regulation (EU) 2023/1230, Article 25(2) and Annex I, Part A, the categories of machinery listed in Annex I, Part A always require one of the Article 25(2) procedures involving a notified body, such as EU type-examination with module C, unit verification (module G), or full quality assurance (module H).","score":0.727},"rag":{"value":"Categories listed in Annex I, Part A","text":"Under Article 6(1) and Article 25(2), machinery categories listed in Annex I, Part A must follow module B with C, module H, or module G, and all three involve a notified body. Recital 59 supports this as the stricter, higher-risk route. The passages do not enumerate the individual Part A categories, so they are not named here.","score":0.0},"steps":null},{"id":"CQ02","en":"Which conformity assessment procedures can the manufacturer choose for machinery listed in Annex I, Part A?","it":"Quali procedure di valutazione della conformità può scegliere il fabbricante per una macchina dell'Allegato I, parte A?","short":"Conformity Assessment Procedures Manufacturer","B":{"value":["module B followed by module C","module H","module G"],"text":"For machinery listed in Annex I, Part A, the manufacturer must apply one of the procedures in Article 25(2): module B followed by module C (Annexes VII and VIII), full quality assurance under module H (Annex IX), or unit verification under module G (Annex X).","score":1.0},"rag":{"value":["EU type-examination (module B) followed by conformity to type based on internal production control (module C), Annex VII and Annex VIII","conformity based on full quality assurance (module H), Annex IX","conformity based on unit verification (module G), Annex X"],"text":"For machinery in a category listed in Annex I, Part A, Article 25(2) of the Machinery Regulation requires the manufacturer to apply one of three procedures: module B followed by module C, module H, or module G. Article 6(1) confirms that Part A categories fall under Article 25(2).","score":0.667},"steps":null},{"id":"CQ03","en":"Which category does a safety component with self-evolving behaviour based on machine learning fall under?","it":"In quale categoria rientra un componente di sicurezza con comportamento auto-evolutivo basato sul machine learning?","short":"Category Safety Component Self-evolving","B":{"value":"Annex I, Part A, point 5 (safety components with fully or partially self-evolving behaviour).","text":"A safety component with fully or partially self-evolving behaviour falls under Annex I, Part A, point 5 of the Regulation. Point 6 covers machinery with embedded self-evolving ML systems, which is a different subject.","score":1.0},"rag":{"value":["Annex I, Part A, point 5"],"text":"A safety component with fully or partially self-evolving behaviour using machine learning approaches that ensures safety functions falls under Annex I, Part A, point 5. Recital 54 supports this by stating that such systems should be included in Annex I.","score":1.0},"steps":null},{"id":"CQ04","en":"When must guards for moving transmission parts be interlocking movable guards instead of fixed guards?","it":"Quando i ripari degli elementi mobili di trasmissione devono essere ripari mobili interbloccati invece che fissi?","short":"Guards Moving Transmission Parts","B":{"value":"Where frequent access is envisaged.","text":"Under Annex III, point 1.3.8.1 of the Regulation, guards for moving transmission parts must be interlocking movable guards rather than fixed guards where frequent access is envisaged.","score":1.0},"rag":{"value":"Where frequent access is envisaged (Annex III, point 1.3.8.1 of the Regulation)","text":"Under Annex III, point 1.3.8.1 of the Regulation, interlocking movable guards shall be used for moving transmission parts where frequent access is envisaged; otherwise either fixed or interlocking movable guards may be used. The corresponding Directive text in Annex I, point 1.3.8.1 says \"should\" rather than \"shall\", so it is less mandatory.","score":1.0},"steps":null},{"id":"CQ05","en":"Which risks does essential health and safety requirement 1.3.7 of Annex III address?","it":"Quali rischi affronta il requisito essenziale 1.3.7 dell'Allegato III?","short":"Risks Essential Health Safety","B":{"value":["risks of contact leading to hazardous situations","accidental blockage of moving parts","psychological stress that may be caused by the interaction with the machinery"],"text":"Under essential health and safety requirement 1.3.7 of Annex III to the Regulation, the risks addressed are contact leading to hazardous situations, contact that could lead to accidents (where risks persist), moving parts, accidental blockage of moving parts, and psychological stress from interaction with the machinery.","score":0.667},"rag":{"value":null,"text":"The passages do not include the text of essential health and safety requirement 1.3.7 of Annex III. They contain only the Annex III section heading (1), points 1.3.3 (falling or ejected objects) and 1.5.13 (hazardous emissions), and the heading for 6.3, none of which is 1.3.7.","score":0.0},"steps":null},{"id":"CQ06","en":"Who is considered the manufacturer after a substantial modification of machinery?","it":"Chi è considerato fabbricante dopo una modifica sostanziale di una macchina?","short":"Considered Manufacturer Substantial Modification","B":{"value":"The natural or legal person who carries out the substantial modification is treated as the manufacturer under Article 18 of the Machinery Regulation, subject to the Article 10 manufacturer obligations (where the modification affects only the safety of machinery or a related product forming part of an assembly).","text":"Under Article 18 of the Machinery Regulation, the natural or legal person carrying out a substantial modification is subject to the manufacturer's obligations in Article 10, provided the modification affects only the safety of that machinery or a related product within an assembly; a non-professional user modifying machinery for own use is excluded.","score":1.0},"rag":{"value":"The natural or legal person who carries out the substantial modification is considered the manufacturer.","text":"Under Article 18 of the Machinery Regulation, a person who carries out a substantial modification of machinery or a related product is considered a manufacturer and must meet the Article 10 manufacturer obligations, including ensuring and declaring conformity and applying the relevant conformity assessment procedure. A non-professional user who modifies machinery for their own use is excluded. Recital 26 explains the new conformity assessment requirement.","score":1.0},"steps":null},{"id":"CQ07","en":"What must accompany machinery when it is placed on the market?","it":"Che cosa deve accompagnare una macchina quando viene immessa sul mercato?","short":"Accompany Machinery Placed Market","B":{"value":["instructions in the official Community language(s) of the Member State where it is placed on the market and/or put into service","ec declaration of conformity","instruction manual","original instructions (or a translation accompanied by the original instructions)"],"text":"Under Directive 2006/42/EC (Annex I, 1.7.4 and Art. 5(1)), which still applies on 2026-11-14, machinery must be accompanied by instructions in the required language, the instruction manual and the original instructions, and by the EC declaration of conformity. The Regulation's corresponding requirements apply only from 2027-01-20.","score":0.333},"rag":{"value":["EC/EU declaration of conformity","instructions for use"],"text":"Under the Directive, Article 5(1)(e), the EC declaration of conformity (Annex II, part 1, Section A) must accompany the machinery. Under the Regulation, Article 15(2)(b) and (c), distributors must verify that the machinery is accompanied by the EU declaration of conformity and by the instructions for use. Article 10(5) also allows identification information to be given in an accompanying document where the machinery's size or nature prevents marking it directly.","score":1.0},"steps":null},{"id":"CQ08","en":"For how long must the manufacturer keep the technical documentation and the EU declaration of conformity?","it":"Per quanto tempo il fabbricante deve conservare la documentazione tecnica e la dichiarazione UE di conformità?","short":"Long Manufacturer Keep Technical","B":{"value":"P10Y","text":"The manufacturer must keep the technical documentation and the EU declaration of conformity for at least 10 years, counted from when the machinery or product is placed on the market or put into service (Machinery Regulation, Art. 10(3) and Art. 12(2)).","score":1.0},"rag":{"value":"P10Y","text":"Manufacturers must keep the technical documentation and the EU declaration of conformity for 10 years after the product is placed on the market (Directive 2014/34/EU Art. 6(3), Directive 2014/68/EU Art. 6(3), Directive 2014/30/EU Art. 7(3), Directive 2014/35/EU Art. 6(3), Regulation (EU) 2016/425 Art. 8(3)). For machinery, Regulation Art. 10(3) requires keeping them for at least 10 years after the machinery is placed on the market or put into service.","score":1.0},"steps":null},{"id":"CQ09","en":"From which date does Regulation (EU) 2023/1230 apply?","it":"Da quale data si applica il Regolamento (UE) 2023/1230?","short":"Date Regulation EU 2023/1230","B":{"value":"2027-01-20","text":"Regulation (EU) 2023/1230 applies generally from 20 January 2027, as corrected by the corrigendum, although certain Articles apply from earlier dates.","score":1.0},"rag":{"value":"2027-01-14","text":"Under Article 54 of Regulation (EU) 2023/1230, the Regulation applies from 14 January 2027, with some earlier-dated exceptions for specific articles. The passage is labelled only 'REG, Art. 54', so the link to 2023/1230 rests on the matching article and date.","score":0.0},"steps":[{"n":1,"f":"st-1598","text":"Regulation: appliesFrom = 20 January 2027 (condition: However, the following Articles shall apply from the following dates)","quote":"read: ‘ 20 January 2027 ’.","locator":"CORR, Corrigendum, point 10"}]},{"id":"CQ10","en":"On 16 January 2027, can machinery conforming to Directive 2006/42/EC still be placed on the market?","it":"Il 16 gennaio 2027 si può ancora immettere sul mercato una macchina conforme alla Direttiva 2006/42/CE?","short":"16 January 2027 Machinery","B":{"value":true,"text":"Yes. Directive 2006/42/EC is repealed only from 20 January 2027, and conforming machinery may be placed on the market until then, so 16 January 2027 is still allowed.","score":1.0},"rag":{"value":false,"text":"No. Under Article 52(1) of the Regulation, Member States may not impede the making available of machinery placed on the market in conformity with Directive 2006/42/EC before 14 January 2027. Since 16 January 2027 is after that cut-off, the transitional protection does not cover placing such machinery on the market on that date.","score":0.0},"steps":null},{"id":"CQ11","en":"For the work equipment listed in Annex VII of Legislative Decree 81/2008, who carries out the first periodic verification, and within what time?","it":"Per le attrezzature dell'Allegato VII del D.Lgs. 81/08, chi effettua la prima verifica periodica e entro quanto tempo?","short":"Work Equipment Listed Annex","B":{"value":"INAIL carries out the first periodic verification, within 45 days from receipt of the complete request.","text":"For Annex VII equipment, the first periodic verification is carried out by INAIL (DM 2011, art. 2, c. 1), within 45 days of receiving the complete request.","score":1.0},"rag":{"value":"INAIL carries out the first periodic verification, within 45 days of the employer's request according to D.Lgs. 81/2008 art. 71(11), but within 60 days according to DM 11 April 2011 art. 2(1).","text":"For equipment listed in Annex VII of D.Lgs. 81/2008, INAIL carries out the first periodic verification. Article 71(11) of D.Lgs. 81/2008 sets the deadline at 45 days from the request, while DM 11 April 2011, art. 2(1), sets it at 60 days. The passages do not resolve this difference, so the 45-day statutory term should be checked against the official text.","score":1.0},"steps":null},{"id":"CQ12","en":"For how long must the employer keep the results of the checks on work equipment?","it":"Per quanto tempo il datore di lavoro deve conservare i risultati dei controlli sulle attrezzature di lavoro?","short":"Long Employer Keep Results","B":{"value":"P3Y","text":"The employer must keep the results of the checks under paragraph 8 of art. 71 of D.Lgs. 81/2008 for at least the last three years.","score":1.0},"rag":{"value":null,"text":"Article 5(3) of Directive 2009/104/EC requires the employer to record the results of inspections, keep them at the disposal of the authorities, and keep them for a 'suitable period of time', but it does not set a fixed duration. The Italian provision (art. 71(11) of Legislative Decree 81/2008) requires the inspection reports to be kept and made available to the supervisory body, also without a stated period.","score":0.0},"steps":null},{"id":"CQ13","en":"Which models in the catalogue, self-certified today with internal checks, will need a notified body from 20 January 2027?","it":"Quali modelli del catalogo, oggi autocertificati con il controllo interno, dal 20 gennaio 2027 dovranno passare da un organismo notificato?","short":"Models Catalogue Self-certified Today","B":{"value":null,"text":"The facts do not identify any catalogue model that is self-certified with internal checks, so they do not show which models will need a notified body from 20 January 2027.","score":0.0},"rag":{"value":null,"text":"The passages do not include a product catalogue, any list of models, or any rule that changes conformity-assessment requirements on 20 January 2027, so they cannot show which models would need a notified body. The passages only cover general notified-body and record-keeping duties, such as the 10-year retention period in Annex IX, point 4 of Directive 2014/34/EU.","score":0.0},"steps":null},{"id":"CQ14","en":"Which conformity assessment procedure will model RC-5 need from 20 January 2027, and why?","it":"Quale procedura di valutazione della conformità servirà al modello RC-5 dal 20 gennaio 2027, e perché?","short":"Conformity Assessment Procedure Will","B":{"value":null,"text":"The facts do not identify model RC-5 or its machinery category, so they cannot say which conformity assessment procedure it will need from 20 January 2027. The applicable procedure depends on whether it falls under Annex I Part A (Art. 25(2)), Part B (Art. 25(3)), or is not listed in Annex I (Art. 25(4), module A).","score":0.0},"rag":{"value":null,"text":"The passages do not identify model RC-5 or say when it, or any date such as 20 January 2027, takes effect. They describe general conformity assessment principles and third-party requirements for safety components and self-evolving systems, but none of them determines which procedure RC-5 needs.","score":0.0},"steps":null},{"id":"CQ15","en":"Can model CS-400 stay with internal production control after 20 January 2027?","it":"Il modello CS-400 potrà restare con il controllo interno della produzione dopo il 20 gennaio 2027?","short":"Model CS-400 Stay Internal","B":{"value":null,"text":"The facts do not mention model CS-400, so they cannot say whether it may stay under internal production control after 20 January 2027; the general rules are in the corrigendum points on the Directive's repeal (fact 56) and the placing-on-the-market date (fact 50).","score":0.0},"rag":{"value":null,"text":"The passages do not address internal production control, model CS-400, or any rule taking effect on 20 January 2027, so the question cannot be answered from them. The relevant conformity-assessment provisions would need to be checked in the full regulation text.","score":0.0},"steps":null},{"id":"CQ21","en":"How often must the DEMAG overhead travelling crane at position 8 of the IGEA lifting equipment list be verified?","it":"Ogni quanto va verificata la gru a ponte scorrevole DEMAG in posizione 8 dell'elenco degli apparecchi di sollevamento di IGEA?","short":"DEMAG Overhead Travelling Crane","B":{"value":"P1Y","text":"The DEMAG overhead travelling crane (IGEA device 8) must be verified once a year (P1Y), under Allegato VII, riga 15, because it is fixed lifting equipment above 200 kg, used in the mining sector, and built in 1985. Assumptions of the rule: truck cranes and mobile cranes are treated as mobile, overhead and gantry cranes and hoists as fixed, and the site's sector applies to every device.","score":1.0},"rag":{"value":null,"text":"The passages do not include Table A2, which lists the overhead travelling cranes (positions 8-13), so I cannot confirm the DEMAG crane at position 8 or its manufacture year and duty type. Passage 0 says all 24 positions follow the Allegato VII intervals, and Allegato VII sets annual verification for lifting equipment over 200 kg in the rows quoted (rows 12, 14 and 15), but which row applies depends on data not given here.","score":0.0},"steps":[{"n":1,"f":"plant_igea-d08-kind","text":"IGEA device 8: deviceKind = GRU A PONTE","quote":"GRU A PONTE 8 DEMAG 5000 CA 127 / 86 1985 503291 SCORREVOLE","locator":"igea-equipment, p. 6"},{"n":2,"f":"plant_igea-d08-capacity","text":"IGEA device 8: capacityKg = 5000","quote":"8 DEMAG 5000 CA 127 / 86 1985 503291","locator":"igea-equipment, p. 6"},{"n":3,"f":"plant_igea-site-sector","text":"IGEA site: siteSector = Area mineraria","quote":"Qtà COMUNE Area mineraria Monteponi 19 Iglesias Campo Pisano Masua - Acquaresi 2 Gadoni Miniera Funtana Raminosa 2 Lula Miniera Sos Enattos 1 Furtei Miniera Furtei","locator":"igea-equipment, p. 3"},{"n":4,"f":"plant_igea-d08-year","text":"IGEA device 8: yearBuilt = 1985","quote":"8 DEMAG 5000 CA 127 / 86 1985 503291","locator":"igea-equipment, p. 6"},{"n":5,"f":"law_verification-annex7-r15","text":"Apparecchi di sollevamento materiali: verificationInterval = Verifiche annuali (condition: con portata superiore a 200 Kg. non azionati a mano, di tipo fisso, con modalità di utilizzo riscontrabili in settori di impiego quali costruzioni, siderurgico, portuale, estrattivo e con anno di fabbricazione antecedente 10 anni)","quote":"Apparecchi di sollevamento materiali con portata superiore a 200 Kg. non azionati a mano, di tipo fisso, con modalità di utilizzo riscontrabili in settori di impiego quali costruzioni, siderurgico, portuale, estrattivo e con anno di fabbricazione antecedente 10 anni | Verifiche annuali","locator":"DLGSALLVII, Allegato VII, riga 15"}]},{"id":"CQ22","en":"How often must the Effer truck-mounted hydraulic crane at position 7 of the IGEA list, built in 2017, be verified?","it":"Ogni quanto va verificata la gru idraulica per autocarro Effer in posizione 7 dell'elenco IGEA, costruita nel 2017?","short":"Effer Truck-mounted Hydraulic Crane","B":{"value":"P1Y","text":"The Effer truck crane at position 7 must be verified every year (P1Y), under the Annex VII rule for mobile lifting equipment above 200 kg used in the extractive sector. Assumptions of the rule: truck cranes and mobile cranes are treated as mobile, overhead and gantry cranes and hoists as fixed, and the site's sector applies to every device.","score":1.0},"rag":{"value":"P1Y","text":"Annual verification (ogni anno), under Allegato VII, row 12 of D.Lgs. 81/08, which applies to mobile lifting equipment over 200 kg used in extractive and similar sectors. The passages do not give position 7's make, year-of-use details, or last verification date. Its mining-area location and the 2017 build year (under 10 years old) point to this row rather than the biennial row for non-extractive use (row 13), but the passages do not state the sector explicitly for position 7.","score":1.0},"steps":[{"n":1,"f":"plant_igea-d07-kind","text":"IGEA device 7: deviceKind = GRU IDRAULICA","quote":"GRU IDRAULICA IVECO 7 Effer 790 2018/200045/CA 2017 100026789 PER AUTOCARRO FIAT","locator":"igea-equipment, p. 6"},{"n":2,"f":"plant_igea-d07-capacity","text":"IGEA device 7: capacityKg = 790","quote":"7 Effer 790 2018/200045/CA 2017 100026789","locator":"igea-equipment, p. 6"},{"n":3,"f":"plant_igea-site-sector","text":"IGEA site: siteSector = Area mineraria","quote":"Qtà COMUNE Area mineraria Monteponi 19 Iglesias Campo Pisano Masua - Acquaresi 2 Gadoni Miniera Funtana Raminosa 2 Lula Miniera Sos Enattos 1 Furtei Miniera Furtei","locator":"igea-equipment, p. 3"},{"n":4,"f":"law_verification-annex7-r12","text":"Apparecchi di sollevamento materiali: verificationInterval = Verifica annuale (condition: con portata superiore a 200 Kg. non azionati a mano, di tipo mobile o trasferibile, con modalità di utilizzo riscontrabili in settori di impiego quali costruzioni, siderurgico, portuale, estrattivo)","quote":"Apparecchi di sollevamento materiali con portata superiore a 200 Kg. non azionati a mano, di tipo mobile o trasferibile, con modalità di utilizzo riscontrabili in settori di impiego quali costruzioni, siderurgico, portuale, estrattivo | Verifica annuale","locator":"DLGSALLVII, Allegato VII, riga 12"},{"n":5,"f":"plant_igea-d07-year","text":"IGEA device 7: yearBuilt = 2017","quote":"7 Effer 790 2018/200045/CA 2017 100026789","locator":"igea-equipment, p. 6"}]},{"id":"CQ23","en":"Who carries out the periodic verifications after the first one on the equipment listed in Annex VII?","it":"Chi effettua le verifiche periodiche successive alla prima sulle attrezzature dell'Allegato VII?","short":"Periodic Verifications Equipment Listed","B":{"value":"ASL (Azienda Sanitaria Locale)","text":"The periodic verifications after the first one on Annex VII equipment are carried out by the ASL, per DM2011 art. 2 c. 1.","score":0.5},"rag":{"value":null,"text":"The passages do not say who carries out periodic verifications after the first one on equipment listed in Annex VII. Annex VII of the Machinery Regulation, as quoted in passage 6, covers EU type-examination by a notified body, and no passage describes periodic re-verification.","score":0.0},"steps":[{"n":1,"f":"law_verification-dm2011-06","text":"subsequent periodic verifications: verifiedBy = ASL (condition: successive alla prima)","quote":"81/2008, l'INAIL e' titolare della prima delle verifiche periodiche da effettuarsi nel termine di sessanta giorni dalla richiesta, mentre le ASL sono titolari delle verifiche periodiche successive alla prima, da effettuarsi nel termine di trenta giorni dalla richiesta.","locator":"DM2011, art. 2, c. 1"}]},{"id":"CQ24","en":"The Ministerial Decree of 11 April 2011 says sixty days and Article 71 of Legislative Decree 81/2008 says forty-five: within how many days of the request must the first periodic verification be carried out today?","it":"Il DM 11 aprile 2011 parla di sessanta giorni e l'art. 71 del D.Lgs. 81/08 di quarantacinque: entro quanti giorni dalla richiesta va fatta oggi la prima verifica periodica?","short":"Ministerial Decree 11 April","B":{"value":"P45D","text":"The first periodic verification must be carried out within 45 days of receiving the complete request, under art. 71, c. 11 of Legislative Decree 81/2008. The facts do not support the 60-day figure attributed to the 2011 Ministerial Decree.","score":1.0},"rag":{"value":"P45D","text":"Article 71(11) of Legislative Decree 81/2008 requires INAIL to carry out the first periodic verification within forty-five days of the request, and that is the figure I'd rely on. Article 2(1) of the 2011 Ministerial Decree says sixty days, which conflicts with the statute it cites, so the discrepancy should be checked before relying on either number. Today's date (2026-11-14) does not affect the calculation.","score":1.0},"steps":null},{"id":"CQ25","en":"Can the UR5e robot arm be put into service on its own, as delivered by the manufacturer?","it":"Il braccio robotico UR5e può essere messo in servizio da solo, così come arriva dal costruttore?","short":"UR5e Robot Arm Put","B":{"value":false,"text":"No. Under the UR e-Series manual (p. 220), the UR5e may only be put into service once integrated into a final complete machine, since it is partly completed machinery.","score":1.0},"rag":{"value":null,"text":"The passages do not directly say whether the UR5e may be put into service on its own as delivered. Section 6 (Assembly and Mounting, p. 38) states that the robot arm, Control Box and Teach Pendant must be assembled before you can continue, and section 4.1 (p. 30) says system design and installation are not covered there and that the assembly instructions must be followed. Section 4.4 (Integration and Responsibility) is listed in the contents but its text is not included.","score":0.0},"steps":[{"n":1,"f":"manufacturer-st-0169","text":"Universal Robots e-Series (UR3e, UR5e, UR7e, UR10e, UR12e and UR16e): putIntoServiceOnlyWhen = shall only be put into service upon being integrated into a final complete machine","quote":"Universal Robots e-Series (UR3e, UR5e, UR7e, UR10e, UR12e and UR16e) shall only be put into service upon being integrated into a final complete machine (robot application or cell), which conforms with the provisions of the Machinery Directive and other applicable Directives.","locator":"ur5e-manual, p. 220"},{"n":2,"f":"manufacturer-st-0116","text":"UR5e robot: isPartlyCompletedMachinery = partly completed machinery","quote":"The robot is partly completed machinery, as such the safety of the robot application depends on the tool/end effector, obstacles and other machines.","locator":"ur5e-manual, p. 180"},{"n":3,"f":"manufacturer-st-0106","text":"UR5e robot arm: putIntoServiceOnlyWhen = risk assessment before placing the robot into operation","quote":"Always conduct a risk assessment before placing the robot into operation.","locator":"ur5e-manual, p. 144"}]},{"id":"CQ26","en":"How often must the nanoScan3 safety laser scanner be tested?","it":"Ogni quanto va provato il laser scanner di sicurezza nanoScan3?","short":"nanoScan3 Safety Laser Scanner","B":{"value":"P1Y","text":"The nanoScan3 protective device must be regularly tested at least once a year (nanoScan3 manual, p. 50), and its detection capability test and thorough check of the main function are also required at least once a year (p. 51).","score":1.0},"rag":{"value":"P1Y","text":"The nanoScan3 must be tested at least once a year: the regular thorough check (Section 5.6.2, page 50, and the minimum requirements on page 51) includes the principal function check and the detection capability (resolution) test. Daily checks of the visual inspection and principal function are only recommended, not required.","score":1.0},"steps":[{"n":1,"f":"manufacturer-st-0546","text":"protective device regular tests: requiresPeriodicCheck = at least once a year","quote":"→ Carry out tests at least once a year.","locator":"nanoscan3-manual, p. 50"},{"n":2,"f":"manufacturer-st-0550","text":"test of the detection capability (resolution): requiresPeriodicCheck = at least once a year","quote":"PROJECT PLANNING 5 Minimum requirements for the regular thorough check The following thorough checks must be       DM.docs.filter(d => d.layer === l.name).map(d => "<button class='node" + (prev.has(d.key) ? " gone" : "") + (d.key === sel ? " sel" : "") + (hl.indexOf(d.key) >= 0 ? " hl" : "") + "' data-node=\"" + esc(d.key) + "\" data-card=\"" + esc(d.key) + "\" title=\"" + esc(d.title) + "\">" + esc(d.name) + "<b>" + num(d.n) + "</b>" + (hl.indexOf(d.key) >= 0 ? "<span class='num'>" + (hl.indexOf(d.key) + 1) + "</span>" : "") + "</button>").join("") + "</div>";
    bands.appendChild(el);
  });
  S.view = {cards: [], links: DM.edges.map(e => ({a: e.a, b: e.b, kind: e.kind === "cites" || e.kind === "applied" ? "derived" : "stored", w: (1.2 + Math.min(3.6, Math.sqrt(e.n) * .7)).toFixed(1), text: e.a === sel || e.b === sel ? EDGE_WORD[e.kind] + " \u00b7 " + e.n : "", hidden: prev.has(e.a) || prev.has(e.b), dim: (sel || hl.length) ? (e.a !== sel && e.b !== sel) : false}))};
  for (let i = 1; i < hl.length; i++) S.view.links.push({a: hl[i - 1], b: hl[i], kind: "derived", w: 2.4, hidden: prev.has(hl[i - 1]) || prev.has(hl[i])});
  const on = DM.docs.filter(d => !off.has(d.key));
  renderOver();
  $("#showing").innerHTML = hl.length ? "<b>The agent's path through the documents</b>: " + hl.length + " documents, numbered in the order the agent used them" : "<b>The document map</b>: " + on.length + " documents, " + num(on.reduce((n, d) => n + d.n, 0)) + " facts in force" + (off.size ? " \u00b7 " + off.size + " withdrawn and kept" : "");
  requestAnimationFrame(() => { drawLinks(false); requestAnimationFrame(() => {
    document.querySelectorAll("#bands .node").forEach(n => n.classList.toggle("gone", off.has(n.dataset.node)));
    document.querySelectorAll("#links [data-a]").forEach(p => { const was = p.classList.contains("pend"); const now = off.has(p.dataset.a) || off.has(p.dataset.b); if (now) p.classList.add("pend"); else if (was) { if (reduced()) p.classList.remove("pend"); else S.timers.push(setTimeout(() => drawIn(p), 350)); } });
    S.view.links.forEach(k => { k.hidden = off.has(k.a) || off.has(k.b); });
    S.dm.prev = new Set(off);
  }); });
}
function pathDocs() {
  const v = S.factView; if (!v || !v.answer) return []; const out = [];
  v.cards.slice().sort((a, b) => a.num - b.num).forEach(c => { const src = c.fact && c.fact.d; const k = DM.group[src] || src; if (DOC[k] && out.indexOf(k) < 0) out.push(k); });
  return out;
}
function renderOver() {
  const o = $("#dover"); const d = S.tab !== "documents" && S.dm.pick ? DOC[S.dm.pick] : null;
  if (!d) { o.hidden = true; return; }
  const off = S.dm.off.has(d.key); const inc = DM.edges.filter(e => e.b === d.key), out = DM.edges.filter(e => e.a === d.key);
  const M = inc.filter(e => e.kind === "cites" && !S.dm.off.has(e.a)).reduce((n, e) => n + e.n, 0);
  const links = out.map(e => EDGE_WORD[e.kind] + " " + DOC[e.b].name + " (" + e.n + ")").concat(inc.map(e => DOC[e.a].name + " " + EDGE_WORD[e.kind] + " it (" + e.n + ")"));
  o.innerHTML = "<div><strong>" + esc(d.title) + "</strong><span>" + esc(LAYER[d.layer].label) + " \u00b7 " + num(d.n) + " facts in force" + (off ? " when present" : "") + (links.length ? " \u00b7 " + esc(links.join(", ")) : "") + "</span>" +
    (off ? "<span class='w'>Without it: " + num(d.n) + " facts leave the ontology (kept as withdrawn, not deleted), " + num(M) + " facts that cite it are flagged for review, " + num(d.devices) + " lifting devices lose their result.</span>" : "") +
    "</div><button class='btn' data-dmo='toggle'>" + (off ? "Put it back" : "Remove") + "</button><button class='btn ghost' data-dmo='close'>Close</button>";
  o.hidden = false;
}
function countUp() {
  const go = S.dm.anim && !reduced(); S.dm.anim = false;
  document.querySelectorAll("#panel [data-count]").forEach(el => {
    const to = +el.dataset.count; if (!go) { el.textContent = num(to); return; }
    const t0 = performance.now(); const tick = t => { const k = Math.min(1, (t - t0) / 800); el.textContent = num(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(tick); }; el.textContent = "0"; requestAnimationFrame(tick);
  });
}
function renderDocuments() {
  const d = DOC[S.dm.sel]; const off = S.dm.off.has(d.key);
  const out = DM.edges.filter(e => e.a === d.key), inc = DM.edges.filter(e => e.b === d.key);
  const citing = inc.filter(e => e.kind === "cites" && !S.dm.off.has(e.a)); const M = citing.reduce((n, e) => n + e.n, 0);
  const corr = out.filter(e => e.kind === "corrects");
  const kinds = {}; DM.edges.forEach(e => { const k = kinds[e.kind] = kinds[e.kind] || [0, 0]; k[0]++; k[1] += e.n; });
  const c = n => "<b data-count='" + n + "'>" + num(n) + "</b>";
  let h = "<p class='lead' style='margin-bottom:6px'>The ontology is built from documents that relate to each other. It changes when one is added or removed.</p>" +
    "<div class='row'><button class='btn ghost' data-preset='corr'>Add the corrigendum</button><button class='btn ghost' data-preset='ur10e'>Add the UR10e manual</button><button class='btn ghost' data-preset='dir'>Remove the Directive</button></div>" +
    "<div class='box' style='border-left:4px solid var(--" + d.layer + ")'><div class='lab'>" + esc(LAYER[d.layer].label.toUpperCase()) + " DOCUMENT" + (off ? " \u00b7 WITHDRAWN" : "") + "</div><p>" + esc(d.title) + "</p>" +
    "<p class='sub'>" + (d.pieces ? num(d.pieces) + " passages \u00b7 " : "") + num(d.n) + " facts in force" + (off ? " when present" : "") + "</p>" +
    "<p class='sub'><b>It</b> " + (out.length ? out.map(e => EDGE_WORD[e.kind] + " " + esc(DOC[e.b].name) + " (" + e.n + ")").join(", ") : "has no link to another document") + ".</p>" +
    "<p class='sub'><b>Others:</b> " + (inc.length ? inc.map(e => esc(DOC[e.a].name) + " " + EDGE_WORD[e.kind] + " it (" + e.n + ")").join(", ") : "no other document links to it") + ".</p>" +
    "<div class='row' style='margin-top:8px'><button class='btn' data-dm='toggle'>" + (off ? "Put it back" : "Remove this document") + "</button></div></div>";
  if (off) {
    h += "<div class='box warn'><div class='lab'>WITHOUT IT</div><ul class='cnt'><li>" + c(d.n) + " facts leave the ontology (kept as withdrawn, not deleted)</li>" +
      corr.map(e => "<li>" + c(e.n) + " values of " + esc(DOC[e.b].name) + " go back to how they were first printed</li>").join("") +
      "<li>" + c(M) + " facts in other documents that cite it are flagged for review</li><li>" + c(d.devices) + " lifting devices lose their result</li></ul>" +
      "<p class='sub'>Recorded answers that used it: " + (d.answers.length ? esc(d.answers.join("; ")) : "no recorded answer used it") + ".</p></div>";
    const ex = []; citing.forEach(e => e.ex.forEach(i => { if (ex.length < 3 && D.facts[i]) ex.push(D.facts[i]); }));
    if (ex.length) h += "<ol class='steps' style='max-height:150px'>" + ex.map(f => "<li><button data-fact=\"" + esc(f.id) + "\" style='padding-left:8px'>" + esc(f.s) + " \u00b7 flagged for review<q>" + esc(f.q || "") + "</q><span class='loc'>" + esc(f.d + " \u00b7 " + f.a) + "</span></button></li>").join("") + "</ol>";
  } else if (S.dm.msg === d.key) {
    h += "<div class='box ok'><div class='lab'>WITH IT</div><ul class='cnt'><li>" + c(d.n) + " checked facts arrive, each with its quote</li>" +
      corr.map(e => "<li>" + c(e.n) + " facts of " + esc(DOC[e.b].name) + " change; the old ones are closed and kept</li>").join("") +
      "<li>" + c(out.filter(e => e.kind === "cites").reduce((n, e) => n + e.n, 0)) + " of its facts cite another document</li></ul></div>";
  }
  h += "<p class='note'>Lines: " + Object.keys(kinds).map(k => EDGE_WORD[k] + " " + kinds[k][1] + " (" + kinds[k][0] + (kinds[k][0] === 1 ? " line" : " lines") + ")").join(" \u00b7 ") + ". Solid: stored in the facts. Dashed: computed.</p>" +
    "<p class='note'>This replays what the store already holds for each document: adding a document here shows its checked facts arriving. Reading a brand-new document runs the extraction first.</p>";
  $("#panel").innerHTML = h; countUp(); showDocMap();
}
function preset(which) {
  const key = {corr: "CORR", ur10e: "ur10e-manual", dir: "DIR"}[which]; if (!DOC[key]) return;
  const adding = which !== "dir"; S.dm.sel = key; S.dm.msg = "";
  S.dm.off = new Set(adding ? [key] : []); if (adding) S.dm.prev = new Set([key]);
  renderDocuments();
  S.timers.push(setTimeout(() => { if (S.tab !== "documents") return; if (adding) { S.dm.off.delete(key); S.dm.msg = key; } else S.dm.off.add(key); S.dm.anim = true; renderDocuments(); }, reduced() ? 0 : 900));
}

/* ---------- score ---------- */
function stack(t) {
  return "<div class='stack' role='img' aria-label='" + t.correct + " right, " + t.unknown + " unknown, " + t.wrong + " wrong'>" + [["right", t.correct], ["unknown", t.unknown], ["wrong", t.wrong]].filter(p => p[1] > 0).map(p => "<div class='" + p[0] + "' style='flex:" + p[1] + "'>" + p[1] + "</div>").join("") + "</div>";
}
function renderScore() {
  const T = D.totals; const grp = (key, name) => "<div class='group'><h3>" + name + " <small>" + T.B[key].n + " questions</small></h3><div class='bar'><span>Plant Atlas</span>" + stack(T.B[key]) + "</div><div class='bar'><span>Plain search</span>" + stack(T.rag[key]) + "</div><p class='say'>" + esc(D.sentences[key]) + "</p>";
  const m = a => { const k = mark(a && a.score, a && a.value); return k ? "<b class='" + k.k + "' title='" + k.t + "'>" + ({right: "\u2713", unknown: "?", partly: "~", wrong: "\u00d7"}[k.k]) + "</b>" : "<b>-</b>"; };
  const R = D.rule, H = D.health, V = D.reader;
  $("#panel").innerHTML = "<p class='lead'>Plant Atlas against plain search, on questions written before building.</p>" +
    "<div class='keys'><span><i style='background:var(--right)'></i>right</span><span><i style='background:var(--unknown-bg);border:1px solid var(--unknown)'></i>says unknown</span><span><i style='background:var(--wrong)'></i>wrong or partly right</span></div>" +
    grp("design", "Design questions") + "<div class='strip' aria-label='Design questions one by one: Plant Atlas, then plain search'>" + D.questions.map(q => "<div title=\"" + esc(q.en) + "\">" + q.id.replace("CQ", "Q") + "<span>" + m(q.B) + m(q.rag) + "</span></div>").join("") + "</div><p class='note'>Each box: Plant Atlas, then plain search.</p></div>" +
    grp("held", "Held-out questions") + "</div>" +
    (D.not_run.length ? "<p class='note' style='margin:-6px 0 12px'>Strategy " + esc(D.not_run.join(", ")) + ": not run.</p>" : "") +
    "<h3>The rule in numbers: no quote, no fact</h3><div class='facts'><div><b>" + num(R.proposed) + "</b>facts proposed</div><div><b>" + num(R.accepted) + "</b>accepted with their quote</div><div><b>" + num(R.rejected) + "</b>refused</div></div>" +
    "<p class='note'><b style='color:var(--ink)'>" + num(H.quote_found) + " of " + num(H.checked) + "</b> checked facts are still found word for word in their documents today. Second reader: " + num(V.checked) + " facts re-read, " + num(V.passed) + " passed, " + num(V.back) + " sent back; not applied to the answers.</p>";
}

/* ---------- changes ---------- */
function renderChanges() {
  const sc = D.scenes[1]; const vi = S.change === "before" ? 0 : 1; const v = sc.variants[vi]; const H = D.health;
  const doc = D.documents.find(d => d.source === S.doc);
  let h = "<h3>A correction arrives: the corrigendum</h3><p class='lead'>" + esc(sc.look) + "</p><div class='row'><span class='seg'><button data-change='before' aria-pressed='" + (vi === 0 && !doc) + "'>" + esc(sc.variants[0].label) + "</button><button data-change='after' aria-pressed='" + (vi === 1 && !doc) + "'>" + esc(sc.variants[1].label) + "</button></span></div>" +
    "<div class='box " + v.result.tone + "'><div class='lab'>RESULT</div><p class='demo'><b>What this demonstrates:</b> " + esc(sc.demo) + "</p><p>" + esc(v.result.text) + "</p>" + (v.result.note ? "<p class='sub'>" + esc(v.result.note) + "</p>" : "") + "</div>" +
    "<h3 style='margin-top:14px'>What if a document changes?</h3><div class='row'><select id='docpick' aria-label='Document'><option value=''>Choose a document</option>" + D.documents.map(d => "<option value=\"" + esc(d.source) + "\"" + (d.source === S.doc ? " selected" : "") + ">" + esc(LAYER[d.layer].label + ": " + d.title) + "</option>").join("") + "</select></div>";
  if (doc) { const cites = doc.referred_by.reduce((n, g) => n + g.count, 0); h += "<div class='box warn'><div class='lab'>IF IT CHANGED</div><p>" + esc(doc.if_changed) + "</p><p class='sub'>" + num(doc.facts_anchored) + " facts anchored in it. " + (cites ? num(cites) + " facts in other documents cite it; examples are on the left." : "No fact in another document cites it.") + (doc.devices_affected ? " " + doc.devices_affected + " devices of the plant depend on it." : "") + "</p></div>"; }
  h += "<p class='note'><b style='color:var(--ink)'>Health check:</b> " + num(H.quote_found) + " of " + num(H.checked) + " checked facts still found word for word in their documents; " + num(H.quote_missing) + " quotes missing, " + num(H.piece_missing) + " passages missing.</p>" +
    "<h3 style='margin-top:12px'>Three worked changes</h3><ul class='whatif'>" + D.what_if.map(w => "<li><b>" + esc(w.title) + "</b>: " + esc(w.result) + "</li>").join("") + "</ul>";
  $("#panel").innerHTML = h;
  showLeft(doc ? docView(doc) : Object.assign(sceneView(1, vi), {title: "<b>The corrigendum</b> \u00b7 " + esc(v.label) + ": old facts are closed and kept, new ones are in force"}));
}

/* ---------- scenes ---------- */
function renderScenes() {
  const si = S.scene; const sc = D.scenes[si]; const vi = S.variant[si] || 0; const v = sc.variants[vi];
  let h = "<div class='row' style='justify-content:space-between;margin-bottom:8px'><p class='lead' style='margin:0'>Six things the ontology can show, on real data.</p><button class='btn ghost' id='play'>" + (S.playing ? "Stop" : "Play") + "</button></div><ol class='scenes'>" +
    D.scenes.map((s, i) => "<li><button data-scene='" + i + "' aria-pressed='" + (i === si) + "'><span class='i'>" + (i + 1) + "</span><strong>" + esc(s.title) + "</strong><span class='c'>" + esc(s.look) + "</span></button></li>").join("") + "</ol>";
  if (sc.variants.length > 1) h += "<div class='row'><span style='font-size:13px;color:var(--muted)'>" + esc(sc.toggle || "Switch") + "</span><span class='seg'>" + sc.variants.map((x, i) => "<button data-variant='" + i + "' aria-pressed='" + (i === vi) + "'>" + esc(x.label) + "</button>").join("") + "</span></div>";
  h += "<div class='box " + v.result.tone + "'><div class='lab'>RESULT</div><p class='demo'><b>What this demonstrates:</b> " + esc(sc.demo) + "</p><p>" + esc(v.result.text) + "</p>" + (v.result.note ? "<p class='sub'>" + esc(v.result.note) + "</p>" : "") + "</div>";

function play() {

  S.scene = 0; S.playing = setInterval(() => { if (S.tab !== "scenes" || S.scene >= D.scenes.length - 1) { clearInterval(S.playing); S.playing = null; if (S.tab === "scenes") renderScenes(); return; } S.scene++; renderScenes(); }, 5000);
  renderScenes();
}

/* ---------- tabs and events ---------- */
function setTab(tab, keepLeft) {
  S.tab = tab; document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  if (history.replaceState) history.replaceState(null, "", "#" + tab + (S.left === "docs" && tab !== "documents" ? "&docs" : "") + (S.embed ? "&embed" : ""));
  const P = $("#panel"); P.scrollTop = 0; P.classList.remove("fadein"); P.getBoundingClientRect(); P.classList.add("fadein");
  if (tab === "ontology") renderOntology();
  else if (tab === "documents") renderDocuments();
  else if (tab === "ask") { renderAsk(); if (!keepLeft) { if (S.answer && S.answer.B && S.answer.B.steps && S.answer.B.steps.length && S.asked) showLeft(answerView(S.answer.B)); else showLeft(sceneView(0, 0)); } }
  else if (tab === "score") { renderScore(); showLeft(S.factView || sceneView(0, 0)); }
  else if (tab === "changes") renderChanges();
  else renderScenes();
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setTab(b.dataset.tab); });
$("#panel").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.go) setTab(b.dataset.go);
  else if (b.dataset.preset) preset(b.dataset.preset);
  else if (b.dataset.dm) { const k = S.dm.sel; if (S.dm.off.has(k)) { S.dm.off.delete(k); S.dm.msg = k; } else { S.dm.off.add(k); S.dm.msg = ""; } S.dm.anim = true; renderDocuments(); }
  else if (b.dataset.fact) { const c = factCard(b.dataset.fact, {status: "flagged for review", flag: true}); if (c) openCard(c); }
  else if (b.id === "odback") { S.odoc = ""; renderOntology(); }
  else if (b.dataset.q) { const q = D.questions.find(x => x.id === b.dataset.q); S.asked = true; ask(q[S.lang], q, true); }
  else if (b.dataset.lang) { S.lang = b.dataset.lang; if (S.q) S.text = S.q[S.lang]; renderAsk(); }
  else if (b.id === "showfacts") { S.asked = true; showLeft(answerView(S.answer.B)); }
  else if (b.dataset.step != null) { const st = S.answer.B.steps[+b.dataset.step]; const v = answerView(S.answer.B); const id = st.f || st.statement_id || ("step" + b.dataset.step); const c = v.cards.find(c => c.id === id); S.asked = true; showLeft(v); if (c) openCard(c); }
  else if (b.dataset.change) { S.change = b.dataset.change; S.doc = ""; renderChanges(); }
  else if (b.dataset.scene != null) { S.scene = +b.dataset.scene; renderScenes(); }
  else if (b.dataset.variant != null) { S.variant[S.scene] = +b.dataset.variant; renderScenes(); }
  else if (b.id === "play") play();
});
$("#panel").addEventListener("submit", e => { e.preventDefault(); const text = $("#qtext").value.trim(); if (!text) return; S.asof = $("#asof").value; S.asked = true; ask(text, findQ(text), true); });
$("#panel").addEventListener("change", e => { if (e.target.id === "docpick") { S.doc = e.target.value; renderChanges(); } else if (e.target.id === "asof") S.asof = e.target.value; });

(function start() {
  const first = D.questions.find(q => q.steps && q.steps.length >= 3 && q.B && q.B.score >= 0.999) || D.questions.find(q => q.steps) || D.questions[0];
  S.q = first; S.text = first.en; S.answer = recorded(first); S.asked = true;
  const tokens = new Set(((location.hash || "") + "&" + (location.search || "")).split(/[#&?=,]/).filter(Boolean));
  if (tokens.has("docs")) S.left = "docs";
  if (tokens.has("embed")) { S.embed = true; document.querySelector(".app").classList.add("embed"); }
  const W = D.whole.totals, H = D.health;
  $("#why").innerHTML = "<span><b>Predictable:</b> the agent follows typed relations between checked facts (<b>" + W.relations + "</b> relations in the schema, <b>" + num(W.in_force) + "</b> facts in force)</span>" +
    "<span><b>Auditable:</b> every step of an answer shows the sentence it rests on (<b>" + num(H.quote_found) + " of " + num(H.checked) + "</b> facts still found word for word in their documents)</span>" +
    "<span><b>Portable:</b> the ontology is a standard file any agent can read (Turtle with SHACL shapes: <a href='ontology.ttl'>ontology.ttl</a>)</span>";
  const tab = ["documents", "ontology", "ask", "score", "changes", "scenes"].find(t => tokens.has(t));
  setTab(tab || DEFAULT_TAB);
  if (/^https?:$/.test(location.protocol)) {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 2500);
    fetch("/api/status", {signal: ctl.signal}).then(r => r.ok ? r.json() : Promise.reject()).then(j => {
      if (!j || typeof j !== "object" || !("today" in j)) return;
      S.live = true; const b = $("#badge"); b.textContent = j.fake ? "live (cached answers)" : "live"; b.classList.add("live"); if (S.tab === "ask") renderAsk();
    }).catch(() => {});
  }
})();
</script>
